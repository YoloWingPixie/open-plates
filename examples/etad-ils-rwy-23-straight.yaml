    - role: atis
      frequency_mhz: 124.85
    - role: app
      frequency_mhz: 124.85
      label: BONN RADAR
    - role: twr
      frequency_mhz: 126.20
    - role: gnd
      frequency_mhz: 135.10
    - role: emergency
      frequency_mhz: 121.50

msa:
  center_navaid_id: SPA
  radius_nm: 25
  bearing_reference: magnetic_inbound
  sectors:
    - start_bearing_deg: 0
      end_bearing_deg: 90
      altitude_ft: 4500
    - start_bearing_deg: 90
      end_bearing_deg: 180
      altitude_ft: 3800
    - start_bearing_deg: 180
      end_bearing_deg: 270
      altitude_ft: 3500
    - start_bearing_deg: 270
      end_bearing_deg: 360
      altitude_ft: 5500

transitions:
  - name: SPANG
    type: approach_transition
    legs:
      - terminator: IF
        transition_type: approach_transition
        to_fix_id: SPANG
        altitude_constraint:
          altitude_description: at_or_above
          altitude_1_ft: 5000
      - terminator: TF
        transition_type: approach_transition
        from_fix_id: SPANG
        to_fix_id: EIFEL
        course_deg: 222
        altitude_constraint:
          altitude_description: at_or_above
          altitude_1_ft: 4000

common_legs:
  - terminator: IF
    transition_type: common
    to_fix_id: EIFEL
    altitude_constraint:
      altitude_description: at
      altitude_1_ft: 4000
  - terminator: CF
    transition_type: common
    from_fix_id: EIFEL
    to_fix_id: ED23F
    course_deg: 225
    altitude_constraint:
      altitude_description: glide_slope_altitude
      altitude_1_ft: 3000
    speed_constraint:
      speed_limit_kt: 185
      speed_limit_description: at_or_below
  - terminator: CF
    transition_type: common
    from_fix_id: ED23F
    to_fix_id: RW23
    course_deg: 225
    vertical_angle_deg: 3.0
    altitude_constraint:
      altitude_description: at
      altitude_1_ft: 1196

missed_approach:
  text_description: Climb to 3000 then direct SPA TACAN and hold inbound 050, right turns, 1 min legs.
  icon_sequence: [climb, direct, hold]
  legs:
    - terminator: CA
      transition_type: missed_approach
      from_fix_id: RW23
      course_deg: 225
      altitude_constraint:
        altitude_description: at_or_above
        altitude_1_ft: 3000
    - terminator: DF
      transition_type: missed_approach
      to_fix_id: SPA
      turn_direction: right
      altitude_constraint:
        altitude_description: at
        altitude_1_ft: 3000
    - terminator: HM
      transition_type: missed_approach
      to_fix_id: SPA
      hold:
        inbound_course_deg: 50
        turn_direction: right
        leg_time_sec: 60

