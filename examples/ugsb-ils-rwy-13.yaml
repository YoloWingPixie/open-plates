missed_approach:
  text_description: Climb to 2000 then climbing right turn to 4000 direct BTM VOR and hold.
  icon_sequence: [climb, turn_right, hold]
  legs:
    - terminator: CA
      transition_type: missed_approach
      from_fix_id: RW13
      course_deg: 125
      altitude_constraint:
        altitude_description: at_or_above
        altitude_1_ft: 2000
    - terminator: DF
      transition_type: missed_approach
      to_fix_id: BTM
      turn_direction: right
      altitude_constraint:
        altitude_description: at
        altitude_1_ft: 4000
    - terminator: HM
      transition_type: missed_approach
      to_fix_id: BTM
      hold:
        inbound_course_deg: 305
        turn_direction: right
        leg_time_sec: 60

