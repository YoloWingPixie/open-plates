[project]
name = "open-plates"
version = "0.1.0"
description = "Structured terminal chart generator (SID/STAR/IAP/airport diagrams) from declarative YAML procedures."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "open-plates contributors" }]
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "click>=8.1",
    "cairosvg>=2.9.0",
    "numpy>=1.26",
    "contourpy>=1.2",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_plates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
